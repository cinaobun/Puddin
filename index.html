<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>mwah</title>
    <meta name="description" content="mwahh :3" />
    <link rel="canonical" href="https://mwahh.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="mwah" />
    <meta property="og:url" content="https://mwahh.xyz/" />
    <meta property="og:site_name" content="mwahh.xyz" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:image"
      content="https://mwahh.xyz/src/images/avatar.webp"
    />
    <meta property="og:image:alt" content="mwah" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/src/icon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/src/icon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/src/icon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"
      defer
    ></script>
  </head>
  <body>    
    <div
      id="token"
      role="dialog"
      aria-modal="true"
      aria-labelledby="token-title"
    >
      <button id="token-button" type="button">
        <img
          class="token"
          src="src/images/femt.webp"
          alt="token"
          fetchpriority="high"
        />
        <small id="token-title">click to enter :P</small>
      </button>
    </div>
    <main class="card">
      <img
        class="avatar"
        src="src/images/avatar.webp"
        alt="avatar"
        width="160"
        height="160"
      />
      <section class="content">
        <h1>Bun</h1>
        <p>my websitee :3</p>
      </section>
    </main>

    <nav class="links" aria-label="socials">
      <a
        class="link-card"
        href="https://pinterest.com/cinnaobun"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Pinterest"
      >
        <iconify-icon
          icon="mage:pinterest"
          aria-hidden="true"
        ></iconify-icon>
      </a>
      
      <a
        class="link-card"
        href="https://github.com/cinaobun/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
      >
        <iconify-icon
          icon="simple-icons:github"
          aria-hidden="true"
        ></iconify-icon>
      </a>
      
      <a
        class="link-card"
        href="https://steamcommunity.com/id/cinaobun/"
        target="_blank"
        rel="noopener noreferrer"
        ria-label="Steam"
      >
        <iconify-icon
          icon="simple-icons:steam"
          aria-hidden="true"
        ></iconify-icon>
      </a>

      
    </nav>
    <div class="flags" aria-label="flags">
      <img
        src="src/images/nonbinary-flag.png"
        alt="Nonbinary flag"
        class="flag"
        width="50"
        height="50"
      />
    </div>
    <footer>
      <p class="site-name">mwahh.xyz</p>
    </footer>
    <script src="script.js" defer></script>
  </body>
</html>
